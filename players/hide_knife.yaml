# The player steals the bloody knife from the Town Hall and hides it at the Temple.
# Hal starts in the Town Hall, so he may see the take. That is a real consequence.
# The market links to the Town Hall and the Temple, so each step is a legal walk.
name: hide_knife
steps:
  - { at: "1 08:05", action: move, target: loc_town_hall }
  - { at: "1 08:06", action: take, item: item_knife }
  - { at: "1 08:07", action: move, target: loc_market }
  - { at: "1 08:08", action: move, target: loc_temple }
  - { at: "1 08:09", action: drop, item: item_knife }
