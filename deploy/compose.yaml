# Live demo in OrbStack (started 2026-11-13). Runs the code in ../../whisperwick-demo
# (the pinned demo worktree), so the demo still moves only when that worktree moves.
# Start or rebuild: docker compose -f deploy/compose.yaml up -d --build
# Keys: data/demo-keys.env (git-ignored, made from data/web-key.txt and data/admin-key.txt).
name: whisperwick
services:
  demo:
    build:
      context: ../../whisperwick-demo
      dockerfile_inline: |
        FROM python:3.12-slim
        COPY --from=ghcr.io/astral-sh/uv:0.9.5 /uv /usr/local/bin/uv
        WORKDIR /app
        # Only what the game needs: no .venv, no data, no tests.
        COPY pyproject.toml uv.lock README.md ./
        COPY whisperwick ./whisperwick
        COPY scenarios ./scenarios
        COPY players ./players
        RUN uv sync --frozen --no-dev
        CMD ["sh", "-c", "exec uv run --no-sync whisperwick play --web --port 8002 --allow-host \"$$ALLOW_HOST\""]
    # Host network: the server binds 127.0.0.1 only (web_server.py), and the Tailscale link
    # forwards :8443 to the Mac's 127.0.0.1:8002. OrbStack shares the Mac's localhost this way.
    network_mode: host
    env_file: ../data/demo-keys.env
    environment:
      ALLOW_HOST: dons-macbook-air.triceratops-powan.ts.net:8443
    volumes:
      - ../../whisperwick-demo/data:/app/data   # games, players, requests survive restarts
      - ../../whisperwick-demo/.env:/app/.env:ro  # model server address (PC1)
    restart: unless-stopped
