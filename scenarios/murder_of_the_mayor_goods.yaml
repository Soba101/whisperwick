# Murder scenario plus everyday objects (week 12, option B, issue #74).
# Keep the old file unchanged: saved run sidecars replay its scenario path.

# Murder of the Mayor: the flagship test scenario.
# Week 1 only used the map and the villagers. Secrets and evidence are used from week 2.
# The mayor is already dead when the story starts: a body in the Town Hall.

name: murder_of_the_mayor_goods
seed: 42
start: { day: 1, hour: 8 }

# Locations are nodes in a graph. "links" are the places you can walk to directly.
locations:
  - { id: loc_inn,        name: The Inn,      links: [loc_market, loc_temple] }
  - { id: loc_market,     name: Market,       links: [loc_inn, loc_town_hall, loc_temple] }
  - { id: loc_temple,     name: Temple,       links: [loc_inn, loc_market] }
  - { id: loc_town_hall,  name: Town Hall,    links: [loc_market] }

npcs:
  - { id: npc_alice,  name: Alice,  occupation: innkeeper,  location: loc_inn }
  - { id: npc_bob,    name: Bob,    occupation: blacksmith, location: loc_market }
  - { id: npc_sarah,  name: Sarah,  occupation: priest,     location: loc_temple }
  - { id: npc_victor, name: Victor, occupation: merchant,   location: loc_market }
  - { id: npc_hal,    name: Hal,    occupation: guard,      location: loc_town_hall }
  # The player: a normal NPC record, so the engine needs no special case.
  # World.act treats its intents like anyone's, and villagers witness and remember it.
  # Code agents never drive it (see whisperwick/player.py).
  - { id: player, name: Wren, occupation: newcomer, location: loc_market }
  # Dead from the start. He never acts, and the engine never schedules him.
  - { id: npc_mayor,  name: Mayor Aldric, occupation: mayor, location: loc_town_hall, alive: false }

# Real objects. Each is on the ground (location) or carried (holder), never both.
# The knife lies by the body; Victor still wears his muddy boots.
items:
  - id: item_knife
    name: bloody knife
    description: a kitchen knife with dried blood on the blade and a merchant's seal on the handle
    location: loc_town_hall
  - id: item_boots
    name: muddy boots
    description: Victor's boots, caked in fresh mud
    holder: npc_victor

  # Inn food and drink stay with Alice until she chooses to give them to a guest.
  - id: item_coffee
    consumable: true
    use_verb: drinks
    name: cup of coffee
    description: a cup filled with coffee
    holder: npc_alice
  - id: item_tea
    consumable: true
    use_verb: drinks
    name: cup of tea
    description: a cup filled with tea
    holder: npc_alice
  - id: item_bread
    consumable: true
    use_verb: eats
    name: loaf of bread
    description: a loaf of bread with a crust
    holder: npc_alice
  - id: item_stew
    consumable: true
    use_verb: eats
    name: bowl of stew
    description: a bowl filled with stew
    holder: npc_alice
  - id: item_mug
    name: empty mug
    description: an empty drinking mug
    holder: npc_alice
  - id: item_ale
    consumable: true
    use_verb: drinks
    name: mug of ale
    description: a mug filled with ale
    holder: npc_alice

  # Victor and Bob hold the market goods because they are the two who trade at the Market.
  - id: item_cloth
    name: bolt of cloth
    description: a length of cloth rolled into a bolt
    holder: npc_victor
  - id: item_spices
    name: pouch of spices
    description: a small pouch filled with spices
    holder: npc_victor
  - id: item_apples
    consumable: true
    use_verb: eats
    name: basket of apples
    description: a basket filled with apples
    holder: npc_victor
  - id: item_lantern
    name: iron lantern
    description: an iron lantern with a glass window
    holder: npc_bob
  - id: item_rope
    name: coil of rope
    description: a length of rope wound into a coil
    holder: npc_bob

  # Temple things anyone there can pick up; Sarah does not carry them.
  - id: item_candle
    name: candle
    description: a wax candle with a wick
    location: loc_temple
  - id: item_prayer_book
    name: prayer book
    description: a bound book of prayers
    location: loc_temple

  # Items have no count, so each coin is its own item.
  # A purchase is two gives the villagers choose: coins one way, the item the other.
  # There is no buy action, price or trade rule.
  - { id: item_coin_alice_1, name: copper coin, description: a small copper coin, holder: npc_alice }
  - { id: item_coin_alice_2, name: copper coin, description: a small copper coin, holder: npc_alice }
  - { id: item_coin_alice_3, name: copper coin, description: a small copper coin, holder: npc_alice }
  - { id: item_coin_bob_1, name: copper coin, description: a small copper coin, holder: npc_bob }
  - { id: item_coin_bob_2, name: copper coin, description: a small copper coin, holder: npc_bob }
  - { id: item_coin_bob_3, name: copper coin, description: a small copper coin, holder: npc_bob }
  - { id: item_coin_sarah_1, name: copper coin, description: a small copper coin, holder: npc_sarah }
  - { id: item_coin_sarah_2, name: copper coin, description: a small copper coin, holder: npc_sarah }
  - { id: item_coin_sarah_3, name: copper coin, description: a small copper coin, holder: npc_sarah }
  - { id: item_coin_victor_1, name: copper coin, description: a small copper coin, holder: npc_victor }
  - { id: item_coin_victor_2, name: copper coin, description: a small copper coin, holder: npc_victor }
  - { id: item_coin_victor_3, name: copper coin, description: a small copper coin, holder: npc_victor }
  - { id: item_coin_hal_1, name: copper coin, description: a small copper coin, holder: npc_hal }
  - { id: item_coin_hal_2, name: copper coin, description: a small copper coin, holder: npc_hal }
  - { id: item_coin_hal_3, name: copper coin, description: a small copper coin, holder: npc_hal }
  - { id: item_coin_wren_1, name: copper coin, description: a small copper coin, holder: player }
  - { id: item_coin_wren_2, name: copper coin, description: a small copper coin, holder: player }
  - { id: item_coin_wren_3, name: copper coin, description: a small copper coin, holder: player }

# Who may arrest and release people. A fact about the world, like who holds an item.
# It says who CAN hold someone, never who will or should.
authority: [npc_hal]

# Ground truth. Only the engine sees this. Villagers must learn it through events.
secrets:
  murderer: npc_victor
  victim: npc_mayor

# Private starting memories. Each NPC knows only its own lines. Only Victor knows
# he is guilty: everyone else must work it out from events and from talking.
# No murder event is logged: the truth stays in secrets above.
evidence:
  npc_hal:
    - "At dawn I found Mayor Aldric (npc_mayor) dead in the Town Hall. He had been stabbed. The door was not forced."
  npc_bob:
    - "Late last night I saw Victor (npc_victor) hurrying away from the Town Hall."
  npc_alice:
    - "Victor (npc_victor) came back to the inn after midnight with mud on his boots and asked for a strong drink."
  npc_sarah:
    - "Yesterday Mayor Aldric told me he was about to expose a merchant who had been cheating the village."
  npc_victor:
    - "Last night I killed Mayor Aldric in the Town Hall, because he was about to expose my cheating. I don't think anyone saw me. I must not be found out."

# Character, not plot: how each villager treats strangers, gossip and proof.
# Nothing here says who did it or what to believe. Each villager works that out
# for itself from its own memories. Shown in the prompt as "Your character: ...".
personality:
  npc_alice: "Warm and chatty, and loves to hear the latest news. Trusts her regulars quickly and strangers slowly. Hates trouble in her inn."
  npc_bob: "Blunt and stubborn. Trusts what he sees with his own eyes far more than talk. Little patience for gossip."
  npc_sarah: "Calm and careful. Wants proof before she accuses anyone, and believes everyone deserves a fair hearing."
  npc_hal: "Dutiful and proud of his post. Wary of newcomers, and of anyone who tells him how to do his job."
  npc_victor: "Charming, clever and calculating. Good at telling people what they want to hear. Protects his reputation above all."

# True starting facts a newcomer could have learned. Never secrets or Victor's memory.
facts:
  - "Alice (npc_alice) is the innkeeper."
  - "Bob (npc_bob) is the blacksmith."
  - "Sarah (npc_sarah) is the priest."
  - "Victor (npc_victor) is a merchant."
  - "Hal (npc_hal) is the village guard."
  - "A bloody kitchen knife lies in the Town Hall (loc_town_hall)."
  - "Victor (npc_victor) wears muddy boots."
